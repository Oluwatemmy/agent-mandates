[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-mandates"
version = "0.2.0"
description = "Who authorized an AI agent to act, whether it stayed inside those bounds, and what it cost when it did not."
readme = "README.md"
keywords = [
    "ai-agents",
    "agentic-commerce",
    "audit-trail",
    "delegation",
    "ed25519",
    "rfc8785",
    "verifiable-credentials",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Ajayi Oluwaseyi Temitope"}]
dependencies = ["pydantic>=2.9", "cryptography>=42.0"]

[project.urls]
Homepage = "https://github.com/Oluwatemmy/agent-mandates"
Repository = "https://github.com/Oluwatemmy/agent-mandates"
Issues = "https://github.com/Oluwatemmy/agent-mandates/issues"
Changelog = "https://github.com/Oluwatemmy/agent-mandates/blob/main/CHANGELOG.md"
Specification = "https://github.com/Oluwatemmy/agent-mandates/blob/main/FORMAT.md"

[project.optional-dependencies]
# Formatters and type checkers change their output between minor releases, so
# an unpinned one means CI and a developer machine can disagree about whether
# the tree is clean. Compatible-release pins keep them in step.
dev = [
    "pytest>=8.0",
    "rfc8785>=0.1",
    "hypothesis>=6.100",
    "mypy~=2.3",
    "ruff~=0.16.7",
]

[project.scripts]
mandates = "agent_mandates.cli:main"

[tool.hatch.build.targets.sdist]
# Tests and vectors ship so a downstream packager can verify the release;
# the Hypothesis example database is machine-local noise.
exclude = [".hypothesis", ".venv"]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mandates"]
# Ships py.typed so the annotations are visible to consumers type checkers.
artifacts = ["src/agent_mandates/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Only our own code is in scope. Third-party stubs are checked against their own
# minimum version, not ours, and failing on those hides real findings.
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["rfc8785.*", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
