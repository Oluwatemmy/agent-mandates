name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # NFC normalization uses whichever Unicode table the running Python ships,
    # and canonical bytes are the product here, so every supported version and
    # platform has to agree rather than being assumed to.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Report the Unicode table in use
        run: python -c "import sys, unicodedata; print(sys.version, 'unicode', unicodedata.unidata_version)"

      - name: Test
        run: python -m pytest -q

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Types
        run: python -m mypy src
